name: Publish scheduled articles

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish today's articles
        run: |
          TODAY=$(date +%Y-%m-%d)
          PUBLISHED=0

          for lang in en pl ru; do
            for file in content/blog/scheduled/$lang/${TODAY}-*.md; do
              [ -f "$file" ] || continue
              slug=$(basename "$file" | sed "s/^${TODAY}-//")
              mv "$file" "content/blog/$lang/$slug"
              git add "content/blog/$lang/$slug"
              git rm "$file" 2>/dev/null || true
              PUBLISHED=1
            done
          done

          if [ "$PUBLISHED" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish scheduled articles for ${TODAY}"
            git push
          else
            echo "No articles scheduled for ${TODAY}"
          fi
